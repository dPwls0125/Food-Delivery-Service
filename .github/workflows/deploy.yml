name: Deploy to EC2 App Server

on:
  push:
    branches: [ develop ]
  workflow_dispatch: # 수종 배포를 가능하게함

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: App Server SSH Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/Food-Delivery-Service
            git pull

            # 최신 소스로 컨테이너 다시 빌드 및 재시작 (DB는 DB서버에 있으므로 영향 없음)
            docker-compose up -d --build
            docker image prune -f
            echo "배포 완료: $(date)"


# image prune : 안쓰는 이미지 제거 
# -d(Detach mode) : 백그라운드 모드. docker 명령을 백그라운드에서 실행함. 

