version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: mysql-delivery
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: delivery
      MYSQL_USER: ${MYSQL_USERNAME}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper-delivery
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-delivery
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  redis:
    image: redis:7
    container_name: redis-delivery
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  # ==========================================
  # 어플리케이션 백엔드 서버 모듈들
  # ==========================================
  api-server:
    build:
      context: .
      args:
        MODULE_NAME: api-server
    container_name: api-server-delivery
    ports:
      - "8080:8080" # 외부에 노출되는 제일 중요한 서버포트
    depends_on:
      - mysql
      - redis
      - kafka
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - MYSQL_USERNAME=${MYSQL_USERNAME}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}

  payment-server:
    build:
      context: .
      args:
        MODULE_NAME: Payment
    container_name: payment-delivery
    # ports:
    #   - "8081:8080" # api-server를 통해서만 접근하도록 외부 노출 포트를 닫음.
    depends_on:
      - mysql
      - redis
      - kafka
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - MYSQL_USERNAME=${MYSQL_USERNAME}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}

  postpayment-server:
    build:
      context: .
      args:
        MODULE_NAME: PostPayment
    container_name: postpayment-delivery
    # ports:
    #   - "8082:8080" # api-server를 통해서만 접근하도록 외부 노출 포트를 닫음.
    depends_on:
      - mysql
      - redis
      - kafka
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - MYSQL_USERNAME=${MYSQL_USERNAME}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}

  status-server:
    build:
      context: .
      args:
        MODULE_NAME: status-server
    container_name: status-delivery
    # ports:
    #   - "8083:8080" # api-server를 통해서만 접근하도록 외부 노출 포트를 닫음.
    depends_on:
      - mysql
      - redis
      - kafka
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - MYSQL_USERNAME=${MYSQL_USERNAME}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}

volumes:
  mysql-data:
  redis-data:
